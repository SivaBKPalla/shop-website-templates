<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop website templates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,620&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <main>
      <p class="kicker">Sample pages</p>
      <h1>Two shop websites.</h1>
      <p class="lede">One page each. Hours, services, location, and a button that calls or texts the shop.</p>
      <div class="cards">
        <a class="card barber" href="barber/">
          <span>Barber shop</span>
          <strong>Atlas Barber Co.</strong>
          <em>Open the sample</em>
        </a>
        <a class="card salon" href="salon/">
          <span>Nail and beauty</span>
          <strong>Lumen Nail Studio</strong>
          <em>Open the sample</em>
        </a>
      </div>
    </main>
  </body>
</html>
